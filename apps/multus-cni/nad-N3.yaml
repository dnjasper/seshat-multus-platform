apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: telco-n3-plane
  namespace: default      
spec:
  config: '{
      "cniVersion": "0.3.1",
      "name": "telco-n3-plane",
      "type": "ipvlan",   
      "master": "ens6",   
      "mode": "l2",       
      "ipam": {
        "type": "whereabouts",     
        "range": "192.168.100.0/24",
        "range_start": "192.168.100.20",
        "range_end": "192.168.100.100"
      }
    }'
