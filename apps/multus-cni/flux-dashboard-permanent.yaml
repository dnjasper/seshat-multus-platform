apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-control-plane-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1" 
stringData:
  flux-dashboard.json: |
    {
        "kind": "Panel",
        "spec": {
          "id": 21,
          "title": "Kubernetes API Requests",
          "description": "",
          "links": [],
          "data": {
            "kind": "QueryGroup",
            "spec": {
              "queries": [
                {
                  "kind": "PanelQuery",
                  "spec": {
                    "query": {
                      "kind": "DataQuery",
                      "version": "v0",
                      "group": "prometheus",
                      "datasource": {
                        "name": "prometheus"
                      },
                      "spec": {
                        "editorMode": "code",
                        "expr": "sum(rate(rest_client_requests_total{namespace=\"$namespace\",cluster=~\"$cluster\"}[1m]))",
                        "interval": "",
                        "legendFormat": "total",
                        "range": true
                      }
                    },
                    "refId": "A",
                    "hidden": false
                  }
                },
                {
                  "kind": "PanelQuery",
                  "spec": {
                    "query": {
                      "kind": "DataQuery",
                      "version": "v0",
                      "group": "prometheus",
                      "datasource": {
                        "name": "prometheus"
                      },
                      "spec": {
                        "editorMode": "code",
                        "expr": "sum(rate(rest_client_requests_total{namespace=\"$namespace\",code!~\"2..\",cluster=~\"$cluster\"}[1m]))",
                        "interval": "",
                        "legendFormat": "errors",
                        "range": true
                      }
                    },
                    "refId": "B",
                    "hidden": false
                  }
                }
              ],
              "transformations": [],
              "queryOptions": {}
            }
          },
          "vizConfig": {
            "kind": "VizConfig",
            "group": "timeseries",
            "version": "13.2.0",
            "spec": {
              "options": {
                "tooltip": {
                  "mode": "multi",
                  "sort": "none",
                  "hideZeros": false
                },
                "legend": {
                  "showLegend": true,
                  "displayMode": "table",
                  "placement": "bottom",
                  "calcs": [
                    "mean",
                    "lastNotNull"
                  ]
                },
                "alertThreshold": true
              },
              "fieldConfig": {
                "defaults": {
                  "custom": {
                    "drawStyle": "line",
                    "lineInterpolation": "linear",
                    "barAlignment": 0,
                    "barWidthFactor": 0.6,
                    "lineWidth": 1,
                    "fillOpacity": 10,
                    "gradientMode": "none",
                    "spanNulls": false,
                    "insertNulls": false,
                    "showPoints": "never",
                    "showValues": false,
                    "pointSize": 5,
                    "stacking": {
                      "mode": "none",
                      "group": "A"
                    },
                    "axisPlacement": "auto",
                    "axisLabel": "",
                    "axisColorMode": "text",
                    "axisBorderShow": false,
                    "scaleDistribution": {
                      "type": "linear"
                    },
                    "axisCenteredZero": false,
                    "hideFrom": {
                      "tooltip": false,
                      "viz": false,
                      "legend": false
                    },
                    "thresholdsStyle": {
                      "mode": "off"
                    }
                  },
                  "color": {
                    "mode": "palette-classic"
                  },
                  "thresholds": {
                    "mode": "absolute",
                    "steps": [
                      {
                        "value": null,
                        "color": "green"
                      },
                      {
                        "value": 80,
                        "color": "red"
                      }
                    ]
                  },
                  "unit": "short"
                },
                "overrides": []
              }
            }
          }
        }
      }