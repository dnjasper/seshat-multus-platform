apiVersion: v1
kind: ConfigMap
metadata:
  name: flux-control-plane-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1" 
stringData:
  flux-dashboard.json: |
    {
      "id": null,
      "uid": "flux-control-plane",
      "title": "Flux Control Plane Metrics",
      "tags": ["flux", "infrastructure"],
      "style": "dark",
      "timezone": "browser",
      "editable": true,
      "hideControls": false,
      "graphTooltip": 1,
      "panels": [
        {
          "type": "timeseries",
          "id": 21,
          "title": "Kubernetes API Requests",
          "gridPos": {
            "h": 8,
            "w": 24,
            "x": 0,
            "y": 0
          },
          "targets": [
            {
              "refId": "A",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(rest_client_requests_total{namespace=\"$namespace\",cluster=~\"$cluster\"}[1m]))",
              "legendFormat": "Total Requests",
              "editorMode": "code",
              "range": true
            },
            {
              "refId": "B",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "expr": "sum(rate(rest_client_requests_total{namespace=\"$namespace\",code!~\"2..\",cluster=~\"$cluster\"}[1m]))",
              "legendFormat": "API Errors",
              "editorMode": "code",
              "range": true
            }
          ],
          "fieldConfig": {
            "defaults": {
              "custom": {
                "drawStyle": "line",
                "lineInterpolation": "linear",
                "lineWidth": 2,
                "fillOpacity": 10
              },
              "unit": "short"
            }
          },
          "options": {
            "tooltip": {
              "mode": "multi"
            },
            "legend": {
              "showLegend": true,
              "displayMode": "table",
              "placement": "bottom",
              "calcs": ["mean", "lastNotNull"]
            }
          }
        }
      ],
      "refresh": "10s",
      "schemaVersion": 39,
      "version": 1
    }
