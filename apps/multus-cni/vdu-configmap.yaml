apiVersion: v1
kind: ConfigMap
metadata:
  name: vdu-network-errors-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
data:
  vdu-errors.json: |-
    {
      "id": null,
      "title": "Unified Telco Operations",
      "tags": ["vdu", "telco"],
      "timezone": "browser",
      "schemaVersion": 36,
      "version": 1,
      "panels": [
        {
          "type": "timeseries",
          "title": "vDU Container Network Errors (Rate)",
          "gridPos": { "h": 8, "w": 24, "x": 0, "y": 0 },
          "id": 1,
          "targets": [
            {
              "expr": "sum(rate(container_network_transmit_errors_total{pod=~\"seshat-vdu.*\"}[2m])) by (pod)",
              "refId": "A",
              "datasource": { "type": "prometheus" }
            }
          ]
        }
      ]
    }
