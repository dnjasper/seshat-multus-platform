apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: telco-data-plane
  namespace: default      
spec:
  config: '{
      "cniVersion": "0.3.1",
      "name": "telco-data-plane",
      "type": "ipvlan",   
      "master": "ens5",   
      "mode": "l2",       
      "ipam": {
        "type": "whereabouts",     
        "range": "192.168.100.0/24" 
      }
    }'
