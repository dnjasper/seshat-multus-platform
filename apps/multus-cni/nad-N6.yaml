apiVersion: "k8s.cni.cncf.io/v1"
kind: NetworkAttachmentDefinition
metadata:
  name: telco-n6-plane
  namespace: default      
spec:
  config: '{
      "cniVersion": "0.3.1",
      "plugins": [
    {
      "type": "ipvlan",
      "master": "ens7",
      "mode": "l2",
      "ipam": {
        "type": "host-local",
        "subnet": "192.168.200.0/24",
        "rangeStart": "192.168.200.150",
        "rangeEnd": "192.168.200.200"
        }
      }
    ]
  }'  
